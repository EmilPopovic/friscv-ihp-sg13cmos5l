package:
  name: friscv-tapeout
  authors:
    - "Emil Popović <mail@emilpopovic.me>"
    - "Matej Jurasić <matej.jurasic@cappig.dev>"

dependencies:
  vernii:                { git: "https://github.com/EmilPopovic/vernii.git",                  version: 0.1.0  }
  axi:                   { git: "https://github.com/pulp-platform/axi.git",                   version: 0.39.1 }
  register_interface:    { git: "https://github.com/pulp-platform/register_interface.git",    version: 0.3.9  }
  tech_cells_generic:    { git: "https://github.com/pulp-platform/tech_cells_generic.git",    version: 0.2.11 }
  common_cells:          { git: "https://github.com/pulp-platform/common_cells.git",          version: 1.32.0 }

vendor_package:
  - name: hyperbus
    target_dir: "hw/vendored/pulp_hyperbus"
    upstream:
      git: "https://github.com/pulp-platform/hyperbus.git"
      rev: "2a14bd8f9a985b488ee23d240764f52f129f7729"
    patch_dir: "hw/vendored/patches/pulp_hyperbus"

sources:
  # PULP HyperBus
  - hw/vendored/pulp_hyperbus/src/hyperbus_pkg.sv
  - hw/configurable_delay.sv
  - hw/vendored/pulp_hyperbus/src/hyperbus_delay.sv
  - hw/vendored/pulp_hyperbus/src/hyperbus_clock_diff_out.sv
  - hw/vendored/pulp_hyperbus/src/hyperbus_ddr_out.sv
  - hw/vendored/pulp_hyperbus/src/hyperbus_trx.sv
  - hw/vendored/pulp_hyperbus/src/hyperbus_cfg_regs.sv
  - hw/vendored/pulp_hyperbus/src/hyperbus_phy2r.sv
  - hw/vendored/pulp_hyperbus/src/hyperbus_w2phy.sv
  - hw/vendored/pulp_hyperbus/src/hyperbus_axi.sv
  - hw/vendored/pulp_hyperbus/src/hyperbus_phy.sv
  - hw/vendored/pulp_hyperbus/src/hyperbus_phy_if.sv
  - hw/vendored/pulp_hyperbus/src/hyperbus_clk_gen.sv
  - hw/vendored/pulp_hyperbus/src/hyperbus.sv

  # Chip RTL
  - hw/friscv_pinmux.sv
  - hw/friscv_chip_soc.sv
